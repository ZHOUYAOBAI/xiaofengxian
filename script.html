<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的剧本 · 《蔡锷与小凤仙》</title>
<meta name="description" content="《蔡锷与小凤仙》完整剧本工作台：按角色筛选台词、检索任意半句歌词直达场次。">
<meta name="theme-color" content="#0E1F1B">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>

<header class="site-head" id="site-head">
  <div class="wrap bar">
    <a href="index.html" class="brand">蔡锷与小凤仙<small>我的剧本</small></a>
    <button class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="展开导航">☰</button>
    <nav class="nav" id="site-nav" aria-label="主导航">
      <a href="index.html">返回前台</a>
      <a href="director.html">导演工作台</a>
      <a href="index.html#showings" class="nav-cta">演出预约</a>
    </nav>
  </div>
</header>

<main class="section-tight bg-paper">
  <div class="wrap-wide">

    <div class="sec-head" style="margin-bottom:28px">
      <span class="t-kicker">SCRIPT WORKBENCH</span>
      <h1 class="t-h1">完整剧本 · 排练稿</h1>
      <p class="t-lead" id="wb-intro">
        六幕、二十八曲、八百余行台词。点自己的名字只看自己的词，
        输入半句歌词回车直达。
      </p>
    </div>

    <div class="wb-shell">

      <!-- 侧栏 -->
      <aside class="wb-side">
        <section>
          <h4>按角色筛选</h4>
          <div class="role-filter-list" id="role-filters"></div>
        </section>

        <section>
          <h4>检索</h4>
          <div class="wb-tools">
            <input class="input" type="search" id="lyric-search" placeholder="输入半句歌词，如：奈何七尺">
            <div class="tools-row">
              <select class="select" id="song-jump" aria-label="跳转到某首曲目">
                <option value="">跳到某首歌…</option>
              </select>
            </div>
            <div class="tools-row" style="grid-template-columns:1fr 1fr">
              <button class="btn btn-ghost btn-sm" id="find-btn">查找并跳转</button>
              <button class="btn btn-ghost btn-sm" id="reset-btn">重置</button>
            </div>
          </div>
        </section>

        <section>
          <h4>场次目录</h4>
          <nav class="wb-act-nav" id="act-nav"></nav>
        </section>
      </aside>

      <!-- 正文 -->
      <div class="wb-body">
        <div class="wb-bar">
          <div class="now" id="now-line">
            <span class="dot"></span><span>选择左侧任一角色开始</span>
          </div>
          <div class="font-ctl" role="group" aria-label="正文字号">
            <button id="font-down" aria-label="减小字号">A-</button>
            <span class="val" id="font-val">100%</span>
            <button id="font-up" aria-label="增大字号">A+</button>
          </div>
        </div>

        <div class="wb-script" id="wb-script">
          <div class="skeleton" style="height:120px;margin-bottom:20px"></div>
          <div class="skeleton" style="height:320px"></div>
        </div>
      </div>

    </div>
  </div>
</main>

<footer class="site-foot grain" style="position:relative">
  <div class="wrap">
    <div class="foot-bottom" style="margin:0;padding-top:0;border:0">
      <span>《蔡锷与小凤仙》庭院音乐剧 · 2026 年 8 月修订版 · 排练用稿</span>
      <span>本站剧本仅供剧团内部排练使用</span>
    </div>
  </div>
</footer>

<div class="toast-wrap" id="toast-wrap" aria-live="polite"></div>

<script src="js/store.js"></script>
<script src="js/motion.js"></script>
<script src="js/workbench.js"></script>
</body>
</html>
